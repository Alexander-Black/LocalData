# .github/workflows/publish-subs.yml
# Несколько подписок -> у каждого своя неугадываемая ссылка на GitHub Pages.
# Все данные (ссылки провайдера, HWID, пути) лежат в ОДНОМ секрете SUBS_JSON.
name: publish-subs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch subscriptions
        env:
          SUBS_JSON: ${{ secrets.SUBS_JSON }}
          # Если репозиторий называется <логин>.github.io, замени на
          # https://${{ github.repository_owner }}.github.io
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/build_subs.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
